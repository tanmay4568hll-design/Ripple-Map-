# Database Configuration for RippleMap
# Default: SQLite (zero-setup embedded database)
# Switch db.type=mysql for MySQL server connection
db.type=sqlite
db.sqlite.url=jdbc:sqlite:ripplemap.db

# MySQL Settings
db.mysql.url=jdbc:mysql://localhost:3306/ripplemap?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.user=root
db.mysql.password=root

# Connection Pool Settings
pool.initialSize=5
pool.maxSize=15
pool.timeoutMs=5000
